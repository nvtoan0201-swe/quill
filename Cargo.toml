[package]
name = "quill"
version = "0.1.0"
edition = "2024"
description = "A focused Markdown writer for Linux with a built-in writing coach"
license = "MIT"
repository = "https://github.com/nvtoan0201-swe/quill"

[dependencies]
anyhow = "1"
base64 = "0.22"
dirs = "5"
env_logger = { version = "0.11", default-features = false }
gpui = "0.2.2"
hmac = "0.12"
log = "0.4"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
unicode-segmentation = "1.12"
ureq = { version = "2", features = ["json"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
ttf-parser = "0.25.1"

# gpui 0.2.2 with one change: `DispatchEventResult` is public so the
# QUILL_SCRIPT test driver can inject real mouse events (see src/script.rs).
[patch.crates-io]
gpui = { path = "vendor/gpui" }
